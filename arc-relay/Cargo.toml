[package]
name = "arc-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"

[lib]
name = "arc_relay"
path = "src/lib.rs"

[[bin]]
name = "arc-relay"
path = "src/main.rs"

[dependencies]
beacon-model = { path = "../beacon-core/crates/beacon-model" }
beacon-proto = { path = "../beacon-core/crates/beacon-proto" }
beacon-jsonrpc = { path = "../beacon-core/crates/beacon-jsonrpc" }
beacon-features = { path = "../beacon-core/crates/beacon-features" }
axum = { version = "0.7", features = ["ws"] }
axum-extra = { version = "0.9", features = ["typed-header", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "signal", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
rmp-serde = ">=1.1, <1.2"
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
zstd = "0.13"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }
async-trait = "0.1"
oauth2 = "4"
reqwest = { version = "0.12", features = ["json", "stream"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pem", "rand_core"] }
rand = "0.8"
futures-util = "0.3"
bytes = "1"

[features]
# Use a 1-second revalidation tick so integration tests finish in ~4s.
# Production builds leave this unset and get the 30-second interval.
fast-revalidate = []

[dev-dependencies]
arc-relay = { path = ".", features = ["fast-revalidate"] }
pretty_assertions = "1"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
