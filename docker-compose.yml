# ARC — local dev docker-compose.
#
# Production compose lives at deploy/docker-compose.prod.yml. This one
# builds from source and uses dev defaults — DO NOT deploy this version.
#
# Usage:
#   docker compose up -d              # arc-relay + arc-web + postgres + traefik
#   docker compose logs -f arc-relay
#   docker compose down               # preserves the postgres volume
#   docker compose down -v            # also wipes the postgres volume
#
# Mac client points at:
#   wss://arc.localhost/ws            (with Traefik)
#   ws://localhost:9900/ws            (bypassing Traefik)

version: "3.8"

services:
  traefik:
    image: traefik:v3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc
      POSTGRES_DB: arc
    volumes:
      - arc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc -d arc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  arc-relay:
    build:
      context: .
      dockerfile: arc-relay/Dockerfile
    ports:
      - "9900:9900"
    environment:
      ARC_DATABASE_URL: postgres://arc:arc@postgres:5432/arc
      ARC_JWT_SECRET: dev-secret-change-me-in-production-min-32-chars
      ARC_BIND_ADDR: "0.0.0.0:9900"
      ARC_OAUTH_REDIRECT_BASE: ${ARC_OAUTH_REDIRECT_BASE:-http://localhost:3000}
      ARC_OAUTH_GOOGLE_CLIENT_ID: ${ARC_OAUTH_GOOGLE_CLIENT_ID:-}
      ARC_OAUTH_GOOGLE_CLIENT_SECRET: ${ARC_OAUTH_GOOGLE_CLIENT_SECRET:-}
      ARC_OAUTH_MICROSOFT_CLIENT_ID: ${ARC_OAUTH_MICROSOFT_CLIENT_ID:-}
      ARC_OAUTH_MICROSOFT_CLIENT_SECRET: ${ARC_OAUTH_MICROSOFT_CLIENT_SECRET:-}
      ARC_OAUTH_GITHUB_CLIENT_ID: ${ARC_OAUTH_GITHUB_CLIENT_ID:-}
      ARC_OAUTH_GITHUB_CLIENT_SECRET: ${ARC_OAUTH_GITHUB_CLIENT_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-beacon-plugins}
      RUST_LOG: arc_relay=info
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arc-relay.rule=(PathPrefix(`/api`) || PathPrefix(`/graphql`) || PathPrefix(`/ws`))"
      - "traefik.http.routers.arc-relay.entrypoints=web"
      - "traefik.http.routers.arc-relay.priority=100"
      - "traefik.http.services.arc-relay.loadbalancer.server.port=9900"
    restart: unless-stopped

  arc-web:
    build:
      context: .
      dockerfile: arc-web/Dockerfile
      args:
        # Local dev: point at the dev arc-relay (Traefik routes /api/* there).
        # For pushing prod-grade builds, override with the production URL.
        NEXT_PUBLIC_ARC_RELAY_URL: ${NEXT_PUBLIC_ARC_RELAY_URL:-http://localhost}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      - arc-relay
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arc-web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.arc-web.entrypoints=web"
      - "traefik.http.routers.arc-web.priority=10"
      - "traefik.http.services.arc-web.loadbalancer.server.port=3000"
    restart: unless-stopped

volumes:
  arc-pgdata:
