# Build + push arc-relay and arc-web container images to Docker Hub on every
# push to main. Tags each image with `:latest` and `:<short-sha>` so prior
# revisions remain pullable for rollback.
#
# Required repo secrets:
#   DOCKERHUB_USERNAME  — Docker Hub account name (e.g. "michaeldancurtis")
#   DOCKERHUB_TOKEN     — Docker Hub access token with write scope
#                          (Account Settings → Personal access tokens →
#                          Read & Write public/private repositories)
#
# Deployment is NOT triggered automatically. After this workflow succeeds, the
# operator (or a separate deploy workflow with explicit approval) calls
# `mcp__hostinger__VPS_updateProjectV1(1147025, "arc")` to pull the new images
# on the VPS. Keeping push and deploy decoupled is intentional for v0 — see
# docs/tier-one-plan.md T1.2 for the full deploy-automation milestone.

name: build-and-push

on:
  push:
    branches: [main]
    # Re-run when the Dockerfiles or anything they include changes.
    paths:
      - "arc-relay/**"
      - "arc-web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are we rebuilding? (free text)"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: arc-relay
            dockerfile: arc-relay/Dockerfile
            build_args: |
              BUILD_SHA=${{ github.sha }}
          - name: arc-web
            dockerfile: arc-web/Dockerfile
            build_args: |
              NEXT_PUBLIC_ARC_RELAY_URL=https://arc.ailuxis.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for cross-build to linux/amd64 from arm runners)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}:${{ steps.vars.outputs.short_sha }}
          build-args: ${{ matrix.image.build_args }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed ${{ matrix.image.name }}"
            echo ""
            echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}:latest\`"
            echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}:${{ steps.vars.outputs.short_sha }}\`"
            echo ""
            echo "Trigger refresh: \`mcp__hostinger__VPS_updateProjectV1(1147025, \"arc\")\`"
          } >> "$GITHUB_STEP_SUMMARY"
